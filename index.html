  .ocj.pred { outline:2px dashed var(--gold); outline-offset:1px; }

  .ek-rang.pobjednik { box-shadow:0 0 0 .5vh var(--gold), 0 0 5vh var(--gold); transform:scale(1.03); font-size:1.25em; }

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ================== PODESI OVDJE ==================
// Zalijepi svoj firebaseConfig iz Firebase konzole (Project settings > Your apps).
const firebaseConfig = {
  apiKey: "AIzaSyAczpqZcPRqPeD7TTIkUmYf8IsPRuyEEU8",
  authDomain: "ekipna-igra.firebaseapp.com",
  databaseURL: "https://ekipna-igra-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ekipna-igra",
  storageBucket: "ekipna-igra.firebasestorage.app",
  messagingSenderId: "300870802435",
  appId: "1:300870802435:web:ee3c76b0005608ed044236"
};
// ====================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const BOJE = [
  {key:'plava', naziv:'Plava', hex:'#2563eb'},
  {key:'zelena', naziv:'Zelena', hex:'#16a34a'},
  {key:'crvena', naziv:'Crvena', hex:'#dc2626'},
  {key:'crna', naziv:'Smeđa', hex:'#7c4a24'},
  {key:'siva', naziv:'Siva', hex:'#6b7280'},
  {key:'bijela', naziv:'Bijela', hex:'#e5e7eb'},
  {key:'zuta', naziv:'Žuta', hex:'#eab308'},
  {key:'oranz', naziv:'Oranž', hex:'#f97316'}
];
const BODOVI = {tacno:2, pola:1, netacno:0};

// ================== PITANJA (učitavaju se iz baze, uređuju kroz "📝 Uredi pitanja") ==================
const PITANJA_PO_KRUGU_DEFAULT = 15;
// Ovaj tekst se koristi SAMO ako baza ikad ostane bez sačuvanih pitanja (npr. dokument ručno obrisan).
const PITANJA_DEFAULT_TEKST = '';

// Pretvara sirovi tekst (jedno "pitanje | odgovor" po redu) u niz objekata {broj, tekst, odgovor}.
// Redovi bez '|' ili sa praznim dijelom se preskaču (ne ruše kviz).
function parsirajPitanja(sirovoTekst){
  const rezultat = [];
  (sirovoTekst || '').split('\n').forEach(red=>{
    const linija = red.trim();
    if(!linija) return;
    const idx = linija.indexOf('|');
    if(idx === -1) return;
    let tekst = linija.slice(0, idx).trim();
    const odgovor = linija.slice(idx+1).trim();
    // Oznake na početku pitanja (mogu se kombinovati, bilo kojim redom):
    // [povezi] = pitanje tipa povezivanje, [dva] = traže se dva odgovora,
    // [slika:URL] = prikazuje sliku uz pitanje
    let povezi = false, dva = false, slika = '';
    tekst = tekst.replace(/^[\u200B-\u200D\uFEFF\s]+/, '');
    let opet = true;
    while(opet){
      opet = false;
      let m;
      if(m = tekst.match(/^\[?\s*povezi\s*\]\s*/i)){ povezi = true; tekst = tekst.slice(m[0].length).trim(); opet = true; continue; }
      if(m = tekst.match(/^\[?\s*dva\s*\]\s*/i)){ dva = true; tekst = tekst.slice(m[0].length).trim(); opet = true; continue; }
      if(m = tekst.match(/^\[\s*slika\s*:\s*([^\]]+?)\s*\]\s*/i)){ slika = m[1].trim(); tekst = tekst.slice(m[0].length).trim(); opet = true; continue; }
    }
    if(!tekst || !odgovor) return;
    rezultat.push({broj: rezultat.length+1, tekst, odgovor, povezi, dva, slika});
  });
  return rezultat;
}
function escapeHtml(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function bojaByKey(k){ return BOJE.find(b=>b.key===k); }
function tamnoText(k){ return (k==='bijela'||k==='zuta') ? '#111' : '#fff'; }

// Kratka riječ za pristup nastavniku, npr. link: ...html?zoni
// (Promijeni "zoni" u bilo koju drugu riječ po želji.)
const TAJNA_RIJEC_NASTAVNIK = 'zoni';
const params = new URLSearchParams(location.search);
const EKRAN = params.get('ekran');
const ULOGA = params.has('ekran') ? 'ekran' : ((params.has(TAJNA_RIJEC_NASTAVNIK) || params.get('rola')==='nastavnik') ? 'nastavnik' : 'ekipa');

// ================== TEMA: svijetli / tamni mod ==================
// Izbor se pamti u pregledniku. Može i preko linka: dodaj ?tema=svijetla ili ?tema=tamna
(function(){
  const KLJUC = 'pubkviz_tema';
  const korijen = document.documentElement;
  const trenutna = ()=>{ try{ return localStorage.getItem(KLJUC)==='svijetla' ? 'svijetla' : 'tamna'; }catch(e){ return 'tamna'; } };
  document.body.classList.add('rola-' + ULOGA);
  // projektor bez ?zoni nema dugme; tamo se tema bira linkom
  const imaDugme = !(ULOGA==='ekran' && !params.has(TAJNA_RIJEC_NASTAVNIK));
  let dugme = null;
  function primijeni(t){
    if(t==='svijetla') korijen.setAttribute('data-tema','svijetla'); else korijen.removeAttribute('data-tema');
    if(dugme){ dugme.textContent = t==='svijetla' ? '🌙' : '☀️'; dugme.title = t==='svijetla' ? 'Tamni mod' : 'Svijetli mod'; dugme.setAttribute('aria-label', dugme.title); }
  }
  if(imaDugme){
    dugme = document.createElement('button');
    dugme.id = 'temaBtn'; dugme.className = 'btn';
    dugme.onclick = ()=>{
      const nova = trenutna()==='svijetla' ? 'tamna' : 'svijetla';
      try{ localStorage.setItem(KLJUC, nova); }catch(e){}
      primijeni(nova);
    };
    document.body.appendChild(dugme);
  }
  primijeni(trenutna());
  // ako se tema promijeni u drugom prozoru istog preglednika (npr. nastavnik -> projektor), prati je
  window.addEventListener('storage', e=>{ if(e.key===KLJUC) primijeni(trenutna()); });
})();

const stanjeRef = db.collection('kviz').doc('stanje');
const timoviRef = db.collection('kviz').doc('timovi');
const pitanjaRef = db.collection('kviz').doc('pitanja');
const odgovoriRef = db.collection('odgovori');
const app = document.getElementById('app');

let audioCtx = null;
function beep(freq, trajanjeMs){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + trajanjeMs/1000);
  }catch(e){}
}

let timerInterval = null;
function pokreniTimerPrikaz(krajMs, elId){
  if(timerInterval) clearInterval(timerInterval);
  let zadnjaSekunda = null;
  function tick(){
    const el = document.getElementById(elId);
    if(!el){ clearInterval(timerInterval); return; }
    const s = Math.max(0, Math.round((krajMs - Date.now())/1000));
    el.textContent = s + 's';
    if(s>=1 && s<=5 && s!==zadnjaSekunda){ zadnjaSekunda=s; beep(880,150); }
    if(s===0 && zadnjaSekunda!==0){ zadnjaSekunda=0; beep(220,500); clearInterval(timerInterval); }
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

async function osiguraStanje(){
  const s = await stanjeRef.get();
  if(!s.exists) await stanjeRef.set({trenutnoPitanje:0, faza:'cekanje', timerSekunde:45, timerKraj:null, timerPauzaSekunde:null, pregledPitanje:1, krug:1});
  const t = await timoviRef.get();
  if(!t.exists){ const init={}; BOJE.forEach(b=>init[b.key]=false); await timoviRef.set(init); }
  const p = await pitanjaRef.get();
  if(!p.exists) await pitanjaRef.set({tekst: PITANJA_DEFAULT_TEKST, poKrugu: PITANJA_PO_KRUGU_DEFAULT});
}
osiguraStanje();

if(ULOGA==='nastavnik'){
  const fsBtn = document.createElement('button');
  fsBtn.id = 'fsBtn';
  fsBtn.className = 'btn';
  fsBtn.textContent = '⛶';
  fsBtn.title = 'Cijeli ekran';
  fsBtn.onclick = ()=>{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else document.documentElement.requestFullscreen().catch(()=>{});
  };
  document.addEventListener('fullscreenchange', ()=>{
    fsBtn.textContent = document.fullscreenElement ? '⛝' : '⛶';
    fsBtn.title = document.fullscreenElement ? 'Izađi iz cijelog ekrana' : 'Cijeli ekran';
  });
  document.body.appendChild(fsBtn);

  const resetBtnGlobal = document.createElement('button');
  resetBtnGlobal.id = 'resetBtnGlobal';
  resetBtnGlobal.className = 'btn danger';
  resetBtnGlobal.textContent = '🗑';
  resetBtnGlobal.title = 'Resetuj kviz';
  resetBtnGlobal.onclick = async ()=>{
    const unos = prompt('Ovo NEPOVRATNO briše sve odgovore, bodove i boje ekipa. Upiši DA da potvrdiš reset kviza:');
    if(unos !== 'DA') return;
    const batch = db.batch();
    const odg = await odgovoriRef.get();
    odg.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    const init={}; BOJE.forEach(b=>init[b.key]=false);
    await timoviRef.set(init); UNDO.length = 0; osvjeziUndo();
    await stanjeRef.set({trenutnoPitanje:0, faza:'cekanje', timerSekunde:45, timerKraj:null, timerPauzaSekunde:null, pregledPitanje:1, krug:1});
  };
  document.body.appendChild(resetBtnGlobal);

  pokreniNastavnika();
} else if(ULOGA==='ekran'){
  pokreniEkran(EKRAN);
} else {
  pokreniEkipu();
}

// ============================= NASTAVNIK =============================
function pokreniNastavnika(){
  let pitanja = [], sirovTekst = '', poKrugu = PITANJA_PO_KRUGU_DEFAULT, stanje = null, pregledUnsub = null, uredjivanje = false;

  stanjeRef.onSnapshot(snap=>{ stanje = snap.data(); crtaj(); });
  pitanjaRef.onSnapshot(snap=>{
    const d = snap.data() || {};
    sirovTekst = d.tekst || '';
    pitanja = parsirajPitanja(sirovTekst);
    poKrugu = d.poKrugu || PITANJA_PO_KRUGU_DEFAULT;
    crtaj();
  });

  function brKrugova(){ return Math.max(1, Math.ceil(pitanja.length / poKrugu)); }

  function crtaj(){
    if(uredjivanje) return crtajUreditor();
    if(!stanje){ app.innerHTML='Učitavanje...'; return; }
    if(stanje.faza==='cekanje') return crtajPocetak();
    if(stanje.faza==='aktivno') return crtajAktivno();
    if(stanje.faza==='pregled') return crtajPregled();
    if(stanje.faza==='medjurang') return crtajMedjurang();
    if(stanje.faza==='rang') return crtajRang();
  }

  function crtajUreditor(){
    app.innerHTML = `<div class="wrap">
      <h1>📝 Uredi pitanja</h1>
      <p style="color:var(--muted)">Jedno pitanje po redu, u formatu: <b>pitanje | odgovor</b>. Redoslijed određuje raspored po krugovima (npr. prvih 15 = Krug 1, sljedećih 15 = Krug 2).</p>
      <p style="color:var(--muted)">Oznake na početku pitanja (mogu se kombinovati): <b>[povezi]</b> = 4 pojma za povezati, <b>[dva]</b> = traže se dva odgovora, <b>[slika:URL]</b> = prikazuje sliku uz pitanje (nalijepi link ka slici, npr. sa Imgur-a ili Google fotki podešenih na "javno"). Primjer: <code>[slika:https://i.imgur.com/xyz.jpg] Koji je ovo grad? | Pariz</code></p>
      <div class="btnrow">
        <label>Pitanja po krugu: <input id="poKruguInput" type="number" min="1" value="${poKrugu}" style="width:80px"></label>
        <span id="brojValidnih" style="color:var(--muted);font-weight:700"></span>
      </div>
      <textarea id="pitanjaText" rows="18" style="font-family:'Courier New',monospace;font-size:0.95rem" placeholder="Pitanje 1? | Odgovor 1
Pitanje 2? | Odgovor 2">${escapeHtml(sirovTekst)}</textarea>
      <div class="btnrow" style="margin-top:14px">
        <button class="btn primary" id="snimiBtn">💾 Snimi</button>
        <button class="btn" id="izvezBtn">⬇️ Izvezi (.txt)</button>
        <button class="btn" id="uveziBtn">⬆️ Uvezi (.txt)</button>
        <input type="file" id="uveziInput" accept=".txt,text/plain" style="display:none">
        <button class="btn danger" id="otkaziBtn">← Nazad bez snimanja</button>
      </div>
    </div>`;
    const ta = document.getElementById('pitanjaText');
    function osvjeziBrojac(){
      const parsed = parsirajPitanja(ta.value);
      const sveLinije = ta.value.split('\n');
      const problematicni = [];
      sveLinije.forEach((red, i)=>{
        const linija = red.trim();
        if(!linija) return;
        const idx = linija.indexOf('|');
        if(idx === -1 || !linija.slice(0,idx).trim() || !linija.slice(idx+1).trim()) problematicni.push(i+1);
      });
      document.getElementById('brojValidnih').textContent = `✓ ${parsed.length} validnih pitanja` +
        (problematicni.length>0 ? ` · ⚠ red(ovi) ${problematicni.join(', ')} nemaju '|' ili im nedostaje tekst/odgovor — biće preskočeni` : '');
    }
    ta.oninput = osvjeziBrojac;
    osvjeziBrojac();

    document.getElementById('otkaziBtn').onclick = ()=>{ uredjivanje=false; crtaj(); };
    document.getElementById('snimiBtn').onclick = async ()=>{
      const noviPoKrugu = parseInt(document.getElementById('poKruguInput').value)||PITANJA_PO_KRUGU_DEFAULT;
      await pitanjaRef.set({tekst: ta.value, poKrugu: noviPoKrugu});
      uredjivanje=false;
    };
    document.getElementById('izvezBtn').onclick = ()=>{
      const blob = new Blob([ta.value], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'pitanja-kviz.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
    document.getElementById('uveziBtn').onclick = ()=> document.getElementById('uveziInput').click();
    document.getElementById('uveziInput').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ ta.value = reader.result; osvjeziBrojac(); };
      reader.readAsText(file, 'UTF-8');
    };
  }

  function crtajPocetak(){
    const linkEkipe = location.origin + location.pathname;
    const qrSlika = 'https://api.qrserver.com/v1/create-qr-code/?size=380x380&data=' + encodeURIComponent(linkEkipe);
    app.innerHTML = `<div class="wrap" style="text-align:center">
      <h1>Pub Kviz —  Start</h1>
      <p>Pitanja spremna: <b>${pitanja.length}</b> (${brKrugova()} ${brKrugova()===1?'krug':'kruga'} po ${poKrugu} pitanja)</p>
      <div style="display:flex; justify-content:center; margin:20px 0 28px">
        <div style="background:#fff;padding:16px;border-radius:20px;display:inline-block">
          <img src="${qrSlika}" alt="QR kod za pristup kvizu" width="380" height="380" style="display:block">
        </div>
      </div>
      <div class="btnrow" style="justify-content:center"><span style="color:var(--muted)">Ekran za projektor:</span>
        <a class="btn primary" href="?ekran=sve&zoni" target="_blank">Sve na jednom (s upravljanjem)</a></div>
      <div class="btnrow" style="justify-content:center"><label>Vrijeme odgovora: <input id="tsec" type="number" value="${stanje.timerSekunde}" min="5" style="width:80px"></label></div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn" id="urediBtn">📝 Uredi pitanja</button>
        <button class="btn primary" id="startBtn" ${pitanja.length===0?'disabled':''}>▶ Pokreni Pitanje 1</button>
      </div>
    </div>`;
    document.getElementById('urediBtn').onclick = ()=>{ uredjivanje=true; crtaj(); };
    document.getElementById('startBtn').onclick = async ()=>{
      const sek = parseInt(document.getElementById('tsec').value)||45;
      await upisiStanje({trenutnoPitanje:1, faza:'aktivno', timerSekunde:sek, timerKraj:null, timerPauzaSekunde:null, krug:1});
    };
  }

  function crtajAktivno(){
    const p = pitanja.find(x=>x.broj===stanje.trenutnoPitanje);
    const krug = stanje.krug || Math.ceil(stanje.trenutnoPitanje/poKrugu);
    const brojUKrugu = ((stanje.trenutnoPitanje-1) % poKrugu) + 1;
    const zadnjePitanjeUkupno = stanje.trenutnoPitanje >= pitanja.length;
    const zadnjeUKrugu = stanje.trenutnoPitanje % poKrugu === 0;
    const imaPrethodno = brojUKrugu > 1; // vraćanje samo unutar trenutnog kruga
    let labelDugme = 'Sljedeće pitanje →';
    if(zadnjePitanjeUkupno) labelDugme = 'Završi i pređi na pregled →';
    else if(zadnjeUKrugu) labelDugme = `Završi Krug ${krug} i pređi na pregled →`;
    app.innerHTML = `<div class="wrap" style="text-align:center">
      <div class="oznaka-red">
        <span class="oznaka-krug veliko">${krug}. Krug</span>
        <span class="oznaka-pitanje veliko">Pitanje ${brojUKrugu} / ${poKrugu}</span>
            ${p && p.povezi ? '<span class="oznaka-tip">Poveži: 4 pojma</span>' : ''}
            ${p && p.dva ? '<span class="oznaka-tip">Dva odgovora</span>' : ''}
      </div>
      <div class="pitanje">${p ? p.tekst : '(pitanje nije pronađeno)'}</div>
      ${p && p.povezi ? '<p style="font-size:1.45rem;font-weight:800;margin:12px 0;line-height:1.3">🔗 Poveži: ekipe upisuju 4 pojma odvojena zarezom.</p>' : ''}
      ${p && p.dva ? '<p style="font-size:1.45rem;font-weight:800;margin:12px 0;line-height:1.3">2️⃣ Traže se dva odgovora: ekipe ih upisuju odvojene zarezom.</p>' : ''}
      ${p && p.slika ? `<img onerror="this.style.display='none'" class="pitanje-slika" src="${escapeHtml(p.slika)}" alt="slika uz pitanje">` : ''}
      ${stanje.timerKraj ? `<div class="timer">⏱ <span id="timerNum"></span></div>` :
        stanje.timerPauzaSekunde ? `<div class="timer" style="color:var(--muted)">⏸ Pauzirano — ${stanje.timerPauzaSekunde}s</div>` : ''}
      <details class="odgovor-ref"><summary>Prikaži tačan odgovor</summary>${p ? p.odgovor : ''}</details>
      <div class="btnrow" style="justify-content:center">
        <label>Vrijeme odgovora: <input id="tsec2" type="number" value="${stanje.timerSekunde}" min="5" style="width:80px"></label>
        ${stanje.timerKraj ? `<button class="btn" id="pauzaTimerBtn">⏸ Pauziraj</button>` :
          stanje.timerPauzaSekunde ? `<button class="btn" id="nastaviTimerBtn">▶ Nastavi (${stanje.timerPauzaSekunde}s)</button>` : ''}
        <button class="btn ${stanje.timerKraj||stanje.timerPauzaSekunde ? '' : 'primary'}" id="startTimerBtn">▶ Pokreni novi tajmer</button>
      </div>
      <div class="btnrow" style="justify-content:center">
        ${imaPrethodno ? `<button class="btn" id="prevBtn">← Prethodno pitanje</button>` : ''}
        <button class="btn primary" id="nextBtn">${labelDugme}</button>
      </div>
    </div>`;
    if(stanje.timerKraj) pokreniTimerPrikaz(stanje.timerKraj, 'timerNum');
    document.getElementById('startTimerBtn').onclick = async ()=>{
      const sek = parseInt(document.getElementById('tsec2').value)||stanje.timerSekunde;
      await upisiStanje({timerSekunde:sek, timerKraj:Date.now()+sek*1000, timerPauzaSekunde:null});
    };
    const pauzaBtn = document.getElementById('pauzaTimerBtn');
    if(pauzaBtn) pauzaBtn.onclick = async ()=>{
      const ostatak = Math.max(0, Math.round((stanje.timerKraj - Date.now())/1000));
      await upisiStanje({timerKraj:null, timerPauzaSekunde:ostatak});
    };
    const nastaviBtn = document.getElementById('nastaviTimerBtn');
    if(nastaviBtn) nastaviBtn.onclick = async ()=>{
      await upisiStanje({timerKraj:Date.now()+stanje.timerPauzaSekunde*1000, timerPauzaSekunde:null});
    };
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.onclick = async ()=>{
      await upisiStanje({trenutnoPitanje: stanje.trenutnoPitanje-1, timerKraj:null, timerPauzaSekunde:null});
    };
    document.getElementById('nextBtn').onclick = async ()=>{
      if(zadnjeUKrugu){
        const pocetakRunde = stanje.trenutnoPitanje - poKrugu + 1;
        await upisiStanje({faza:'pregled', timerKraj:null, timerPauzaSekunde:null, pregledPitanje:pocetakRunde});
      } else {
        await upisiStanje({trenutnoPitanje: stanje.trenutnoPitanje+1, timerKraj:null, timerPauzaSekunde:null});
      }
    };
  }

  function crtajPregled(){
    const trenutno = stanje.pregledPitanje || 1;
    const krug = stanje.krug || Math.ceil(trenutno/poKrugu);
    const pocetakRunde = (krug-1)*poKrugu + 1;
    const krajRunde = krug*poKrugu;
    const jeZadnjaRunda = krug >= brKrugova();
    const brojUKrugu = trenutno - pocetakRunde + 1;
    const p = pitanja.find(x=>x.broj===trenutno);
    if(pregledUnsub) pregledUnsub();
    pregledUnsub = odgovoriRef.where('pitanje','==',trenutno).onSnapshot(snap=>{
      const odgovori = snap.docs.map(d=>({id:d.id, ...d.data()}));
      const odgovoriliKeys = odgovori.map(o=>o.boja);
      const nijeOdgovorilo = BOJE.filter(b=>!odgovoriliKeys.includes(b.key));
      const brOcijenjeno = odgovori.filter(o=>o.ocjena).length;
      const brPred = odgovori.filter(o=>predlozi(p,o)).length;
      app.innerHTML = `<div class="wrap">
        <h2 style="text-align:center;margin-bottom:4px">Pregled odgovora</h2>
        <p style="text-align:center;color:var(--muted);margin:0 0 14px">Ocijenjeno ${brOcijenjeno} / ${odgovori.length} pristiglih odgovora${nijeOdgovorilo.length ? ` · ${nijeOdgovorilo.length} nije odgovorilo` : ''}</p>
        <div class="btnrow" style="justify-content:center">
          <button class="btn" id="prevQ" ${trenutno<=pocetakRunde?'disabled':''}>← Prethodno</button>
          <div class="oznaka-red" style="margin:0">
            <span class="oznaka-krug veliko">${krug}. Krug</span>
            <span class="oznaka-pitanje veliko">Pitanje ${brojUKrugu} / ${poKrugu}</span>
            ${p && p.povezi ? '<span class="oznaka-tip">Poveži: 4 pojma</span>' : ''}
            ${p && p.dva ? '<span class="oznaka-tip">Dva odgovora</span>' : ''}
          </div>
          <button class="btn" id="nextQ" ${trenutno>=krajRunde?'disabled':''}>Sljedeće →</button>
        </div>
        <div class="pitanje">${p?p.tekst:''}</div>
      ${p && p.povezi ? '<p style="font-size:1.45rem;font-weight:800;margin:12px 0;line-height:1.3">🔗 Poveži: ekipe upisuju 4 pojma odvojena zarezom.</p>' : ''}
      ${p && p.dva ? '<p style="font-size:1.45rem;font-weight:800;margin:12px 0;line-height:1.3">2️⃣ Traže se dva odgovora: ekipe ih upisuju odvojene zarezom.</p>' : ''}
        ${p && p.slika ? `<img onerror="this.style.display='none'" class="pitanje-slika malo" src="${escapeHtml(p.slika)}" alt="slika uz pitanje">` : ''}
        <div class="tacanOdg">Tačan odgovor: <b>${p?p.odgovor:''}</b></div>
        <div class="btnrow"><button class="btn primary" id="sveTacno">✓ Označi sve kao tačno</button>
          <button class="btn" id="prihvatiBtn" ${brPred?'':'disabled'}>💡 Prihvati prijedloge (${brPred})</button></div>
        <div class="odglist">
          ${odgovori.map(o=>{ const b=bojaByKey(o.boja); const pred = predlozi(p,o); return `<div class="odgred" style="border-left-color:${b.hex}">
            <span class="bojaznak" style="background:${b.hex}"></span><b>${b.naziv}</b>: <span class="odgtxt">${escapeHtml(o.tekst)}</span>
            <span class="ocjbtns">
              <button class="ocj ${o.ocjena==='tacno'?'sel-t':''}${pred==='tacno'?' pred':''}" data-id="${o.id}" data-o="tacno">✓</button>
              <button class="ocj ${o.ocjena==='pola'?'sel-p':''}${pred==='pola'?' pred':''}" data-id="${o.id}" data-o="pola">±</button>
              <button class="ocj ${o.ocjena==='netacno'?'sel-n':''}${pred==='netacno'?' pred':''}" data-id="${o.id}" data-o="netacno">✗</button>
            </span></div>`; }).join('')}
          ${nijeOdgovorilo.map(b=>`<div class="odgred prazno" style="border-left-color:${b.hex}"><span class="bojaznak" style="background:${b.hex}"></span><b>${b.naziv}</b>: <i>nema odgovora (0 bodova)</i></div>`).join('')}
        </div>
        <button class="btn success" id="prikaziRang">${jeZadnjaRunda ? '🏆 Prikaži rang listu' : `🏆 Prikaži međurezultat (kraj Kruga ${krug})`}</button>
      </div>`;
      document.getElementById('prevQ').onclick = ()=>upisiStanje({pregledPitanje:trenutno-1});
      document.getElementById('nextQ').onclick = ()=>upisiStanje({pregledPitanje:trenutno+1});
      document.getElementById('sveTacno').onclick = async ()=>{
        if(!confirm('Označiti SVE prikazane odgovore kao tačne? Ovo prepisuje postojeće ocjene za ovo pitanje.')) return;
        await grupnaOcjena(odgovori.map(o=>({id:o.id, stara:o.ocjena, nova:'tacno'})), 'sve tačno');
      };
      document.getElementById('prikaziRang').onclick = ()=>upisiStanje((jeZadnjaRunda ? {faza:'rang', otkriveno:0} : {faza:'medjurang'}));
      document.getElementById('prihvatiBtn').onclick = ()=>{ const st = odgovori.map(o=>({id:o.id, stara:o.ocjena, nova:predlozi(p,o)})).filter(x=>x.nova); grupnaOcjena(st, 'prijedlozi ocjena'); };
      document.querySelectorAll('.ocj').forEach(btn=>{
        btn.onclick = ()=>postaviOcjenu(btn.dataset.id, btn.dataset.o);
      });
    });
  }

  function crtajMedjurang(){
    const krugZavrsen = stanje.krug || 1;
    const krajRunde = krugZavrsen*poKrugu;
    odgovoriRef.where('pitanje','<=',krajRunde).get().then(snap=>{
      const bodovi={}; BOJE.forEach(b=>bodovi[b.key]=0);
      snap.forEach(d=>{ const o=d.data(); bodovi[o.boja]=(bodovi[o.boja]||0)+(BODOVI[o.ocjena]||0); });
      const lista = BOJE.map(b=>({...b, bod:bodovi[b.key]||0})).sort((a,b)=>b.bod-a.bod);
      const imaJosRundi = krugZavrsen < brKrugova();
      app.innerHTML = `<div class="wrap"><h1>📊 Međurezultat — kraj ${krugZavrsen}. Kruga</h1>
        ${lista.map((t,i)=>`<div class="rangred" style="background:${t.hex};color:${tamnoText(t.key)}"><span class="mjesto">${i+1}.</span> ${t.naziv} — <b>${t.bod} bodova</b></div>`).join('')}
        <div class="btnrow">
          <button class="btn" id="natragBtn">← Nazad na pregled</button>
          ${imaJosRundi ? `<button class="btn primary" id="sljedecaRundaBtn">▶ Pokreni Krug ${krugZavrsen+1}</button>` : ''}
        </div>
      </div>`;
      document.getElementById('natragBtn').onclick = ()=>upisiStanje({faza:'pregled'});
      const btnSljedeca = document.getElementById('sljedecaRundaBtn');
      if(btnSljedeca) btnSljedeca.onclick = ()=>upisiStanje({
        trenutnoPitanje: krajRunde+1, faza:'aktivno', krug: krugZavrsen+1, timerKraj:null, timerPauzaSekunde:null
      });
    });
  }

  function crtajRang(){
    Promise.all([odgovoriRef.get(), timoviRef.get()]).then(([snap, timSnap])=>{
      const brPrijavljenih = BOJE.filter(b=>(timSnap.data()||{})[b.key]).length;
      const otk = stanje.otkriveno==null ? brPrijavljenih : stanje.otkriveno;
      const bodovi={}; BOJE.forEach(b=>bodovi[b.key]=0);
      const bodoviPoKrugu = {}; BOJE.forEach(b=>bodoviPoKrugu[b.key]={});
      snap.forEach(d=>{
        const o=d.data();
        const poeni = BODOVI[o.ocjena]||0;
        bodovi[o.boja]=(bodovi[o.boja]||0)+poeni;
        const k = Math.ceil(o.pitanje/poKrugu);
        bodoviPoKrugu[o.boja][k] = (bodoviPoKrugu[o.boja][k]||0)+poeni;
      });
      const lista = BOJE.map(b=>({...b, bod:bodovi[b.key]||0, bodPoKrugu:bodoviPoKrugu[b.key]||{}})).sort((a,b)=>b.bod-a.bod);
      app.innerHTML = `<div class="wrap"><h1>🏆 Konačna rang lista</h1>
        <div class="btnrow" style="justify-content:center"><button class="btn primary" id="otkrijBtn" ${otk>=brPrijavljenih?'disabled':''}>🎬 Otkrij sljedeće na projektoru (${Math.min(otk,brPrijavljenih)}/${brPrijavljenih})</button><button class="btn" id="otkrijSveBtn" ${otk>=brPrijavljenih?'disabled':''}>Otkrij sve</button></div>
        ${lista.map((t,i)=>{
          const detaljno = Array.from({length:brKrugova()}, (_,k)=>`R${k+1}: ${t.bodPoKrugu[k+1]||0}`).join(' · ');
          return `<div class="rangred" style="background:${t.hex};color:${tamnoText(t.key)};flex-direction:column;align-items:flex-start;gap:4px">
            <div><span class="mjesto">${i+1}.</span> ${t.naziv} — <b>${t.bod} bodova</b></div>
            <div style="font-weight:600;font-size:.95rem;opacity:.85">${detaljno}</div>
          </div>`;
        }).join('')}
        <div class="btnrow">
          <button class="btn" id="natragBtn">← Nazad na pregled</button>
          <button class="btn" id="pocetakBtn">⟲ Povratak na početak kviza</button>
        </div>
      </div>`;
      document.getElementById('natragBtn').onclick = ()=>upisiStanje({faza:'pregled'});
      document.getElementById('pocetakBtn').onclick = ()=>upisiStanje({faza:'cekanje'});
      document.getElementById('otkrijBtn').onclick = ()=>upisiStanje({otkriveno:Math.min(brPrijavljenih, otk+1)});
      document.getElementById('otkrijSveBtn').onclick = ()=>upisiStanje({otkriveno:brPrijavljenih});
    });
  }
}

// ============================== EKRAN (projektor) ==============================
// Samo prikaz, bez kontrola. Linkovi: ?ekran=pitanje | ?ekran=odgovori | ?ekran=rezultati | ?ekran=sve
// Dvoklik na ekran = cijeli ekran.
function pokreniEkran(tip){
  document.body.classList.add('ekran');
  const upravlja = params.has(TAJNA_RIJEC_NASTAVNIK);
  document.addEventListener('dblclick', ()=>{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else document.documentElement.requestFullscreen().catch(()=>{});
  });
  let stanje = null, timovi = {}, pitanja = [], poKrugu = PITANJA_PO_KRUGU_DEFAULT, odgovori = [];
  stanjeRef.onSnapshot(s=>{ stanje = s.data(); crtaj(); });
  timoviRef.onSnapshot(s=>{ timovi = s.data() || {}; crtaj(); });
  pitanjaRef.onSnapshot(s=>{
    const d = s.data() || {};
    pitanja = parsirajPitanja(d.tekst || '');
    poKrugu = d.poKrugu || PITANJA_PO_KRUGU_DEFAULT;
    crtaj();
  });
  odgovoriRef.onSnapshot(s=>{ odgovori = s.docs.map(d=>({id:d.id, ...d.data()})); crtaj(); });

  const prijavljene = ()=>BOJE.filter(b=>timovi[b.key]);
  const ZNAK = {tacno:'✓', pola:'±', netacno:'✗'};

  function oznake(n){
    const krug = (stanje && stanje.krug) || Math.ceil(n/poKrugu);
    const u = ((n-1) % poKrugu) + 1;
    const p = pitanja.find(x=>x.broj===n);
    return `<div class="oznaka-red" style="margin:0">
      <span class="oznaka-krug veliko">${krug}. Krug</span>
      <span class="oznaka-pitanje veliko">Pitanje ${u} / ${poKrugu}</span>
      ${p && p.povezi ? '<span class="oznaka-tip">Poveži: 4 pojma</span>' : ''}
      ${p && p.dva ? '<span class="oznaka-tip">Dva odgovora</span>' : ''}
    </div>`;
  }

  function viewPitanje(){
    const f = stanje.faza;
    if(f==='cekanje'){
      const link = location.origin + location.pathname;
      const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(link);
      return `<div class="ek-start"><img src="${qr}" alt="QR kod za prijavu ekipa">
        <div><div class="ek-pitanje">Pub Kviz</div><div class="ek-tacan">Skeniraj QR kod i izaberi boju svoje ekipe</div></div></div>`;
    }
    if(f==='medjurang') return `<div class="ek-centar"><div class="ek-pitanje">📊 Međurezultat — kraj ${stanje.krug||1}. kruga</div></div>`;
    if(f==='rang') return `<div class="ek-centar"><div class="ek-pitanje">🏆 Konačna rang lista</div></div>`;
    const n = f==='pregled' ? (stanje.pregledPitanje||1) : stanje.trenutnoPitanje;
    const p = pitanja.find(x=>x.broj===n);
    return oznake(n) +
      `<div class="ek-pitanje">${p ? p.tekst : ''}</div>` +
      (f==='aktivno' && p && p.povezi ? `<div class="ek-uputa">🔗 Poveži: upiši 4 pojma odvojena zarezom</div>` : '') +
      (f==='aktivno' && p && p.dva ? `<div class="ek-uputa">2️⃣ Traže se DVA odgovora: upiši ih odvojene zarezom</div>` : '') +
      (p && p.slika ? `<img class="ek-slika" onerror="this.style.display='none'" src="${escapeHtml(p.slika)}" alt="slika uz pitanje">` : '') +
      (f==='pregled' && p ? `<div class="ek-tacan">Tačan odgovor: <b>${p.odgovor}</b></div>` : '');
  }

  function viewOdgovori(){
    const f = stanje.faza, tim = prijavljene();
    if(f==='cekanje'){
      return `<div class="ek-naslov">Prijavljene ekipe: ${tim.length} / ${BOJE.length}</div>
        <div class="ek-lista dvije">${BOJE.map(b=>{
          const zauzeta = !!timovi[b.key];
          return `<div class="ek-ekipa ${zauzeta?'':'prazno'}" style="border-left-color:${b.hex}"><span class="ime">${b.naziv}</span><span class="stat">${zauzeta?'✓ prijavljena':'slobodno'}</span></div>`;
        }).join('')}</div>`;
    }
    if(f==='aktivno'){
      const odg = odgovori.filter(o=>o.pitanje===stanje.trenutnoPitanje);
      const timer = stanje.timerKraj ? `<div class="ek-timer"><span id="timerNum"></span></div>` :
        stanje.timerPauzaSekunde ? `<div class="ek-timer mutan">⏸ ${stanje.timerPauzaSekunde}s</div>` :
        `<div class="ek-timer mutan">${stanje.timerSekunde}s</div>`;
      const k = tim.filter(b=>odg.some(o=>o.boja===b.key)).length;
      return `${timer}<div class="ek-naslov" style="text-align:center">Odgovorilo ${k} / ${tim.length} ekipa</div>
        <div class="ek-lista dvije">${tim.map(b=>{
          const gotovo = odg.some(o=>o.boja===b.key);
          return `<div class="ek-ekipa ${gotovo?'tacno':''}" style="border-left-color:${b.hex}"><span class="ime">${b.naziv}</span><span class="stat">${gotovo?'✓ poslano':'čeka se…'}</span></div>`;
        }).join('')}</div>`;
    }
    // pregled, međurezultat i rang: odgovori na pitanje koje se trenutno pregleda
    const n = stanje.pregledPitanje || 1;
    const odg = odgovori.filter(o=>o.pitanje===n);
    const lista = BOJE.filter(b=>timovi[b.key] || odg.some(o=>o.boja===b.key));
    return `<div class="ek-naslov">Odgovori ekipa</div><div class="ek-lista">${lista.map(b=>{
      const o = odg.find(x=>x.boja===b.key);
      if(!o) return `<div class="ek-ekipa prazno" style="border-left-color:${b.hex}"><span class="ime">${b.naziv}</span><span class="ek-odg">bez odgovora</span></div>`;
      const pred = upravlja ? predlozi(pitanja.find(x=>x.broj===n), o) : null;
      return `<div class="ek-ekipa ${o.ocjena||''}" style="border-left-color:${b.hex}"><span class="ime">${b.naziv}</span><span class="ek-odg">${escapeHtml(o.tekst)}</span><span class="stat">${ZNAK[o.ocjena]||''}</span>${upravlja ? `<span class="ek-ocj">${['tacno','pola','netacno'].map(k=>`<button class="ocj ${o.ocjena===k ? {tacno:'sel-t',pola:'sel-p',netacno:'sel-n'}[k] : ''}${pred===k?' pred':''}" data-id="${o.id}" data-o="${k}">${ZNAK[k]}</button>`).join('')}</span>` : ''}</div>`;
    }).join('')}</div>`;
  }

  function viewRezultati(){
    const m = {}; BOJE.forEach(b=>m[b.key]=0);
    odgovori.forEach(o=>{ m[o.boja] = (m[o.boja]||0) + (BODOVI[o.ocjena]||0); });
    const lista = BOJE.filter(b=>timovi[b.key]).map(b=>({...b, bod:m[b.key]})).sort((a,b)=>b.bod-a.bod);
    if(!lista.length) return `<div class="ek-naslov">Rang lista</div><div class="ek-naslov">Čeka se prijava ekipa…</div>`;
    let rang = 0, prev = null;
    return `<div class="ek-naslov">Rang lista</div><div class="ek-lista">${lista.map((t,i)=>{
      if(t.bod !== prev){ rang = i+1; prev = t.bod; }
      return `<div class="ek-rang" style="background:${t.hex};color:${tamnoText(t.key)}"><span class="mj">${rang}.</span>${t.naziv}<span class="bod">${t.bod}</span></div>`;
    }).join('')}</div>`;
  }

  // ----- otkrivanje pobjednika: od zadnjeg mjesta prema prvom -----
  let zadnjeOtk = null, cekaPobjednika = false, animirajPob = false, otkTimer = null;
  function viewOtkrivanje(){
    const m = {}; BOJE.forEach(b=>m[b.key]=0);
    odgovori.forEach(o=>{ m[o.boja] = (m[o.boja]||0) + (BODOVI[o.ocjena]||0); });
    const lista = BOJE.filter(b=>timovi[b.key]).map(b=>({...b, bod:m[b.key]})).sort((a,b)=>b.bod-a.bod);
    const N = lista.length;
    if(!N) return `<div class="ek-naslov" style="text-align:center">Nema prijavljenih ekipa</div>`;
    const otk = (stanje.otkriveno==null) ? N : Math.min(N, Math.max(0, stanje.otkriveno));
    if(zadnjeOtk!==null && otk<zadnjeOtk){ cekaPobjednika = false; clearTimeout(otkTimer); }
    const novo = zadnjeOtk!==null && otk>zadnjeOtk;
    if(novo && otk===N){
      cekaPobjednika = true; zvuk(); zvukBubanj();
      clearTimeout(otkTimer);
      otkTimer = setTimeout(()=>{ cekaPobjednika = false; animirajPob = true; zvukFanfara(); konfete(); crtaj(); }, 1900);
    } else if(novo){ zvuk(); zvukOtkrij(N-otk); }
    let rang = 0, prev = null;
    const mjesta = lista.map((t,i)=>{ if(t.bod!==prev){ rang = i+1; prev = t.bod; } return rang; });
    const redovi = lista.map((t,i)=>{
      if(i < N-otk){
        if(i===0 && cekaPobjednika) return `<div class="ek-rang bubanj">🥁 …</div>`;
        return `<div class="ek-rang skriveno">${mjesta[i]}. mjesto — ?</div>`;
      }
      const pob = mjesta[i]===1 && otk===N && !cekaPobjednika;
      const anim = (novo && otk<N && i===N-otk) || (animirajPob && i===0);
      return `<div class="ek-rang${anim?' novo':''}${pob?' pobjednik':''}" style="background:${t.hex};color:${tamnoText(t.key)}"><span class="mj">${mjesta[i]}.</span>${pob?'👑 ':''}${t.naziv}<span class="bod">${t.bod}</span></div>`;
    });
    animirajPob = false; zadnjeOtk = otk;
    return `<div class="ek-naslov" style="text-align:center">🏆 Konačni poredak${otk===N && !cekaPobjednika ? ' — čestitamo!' : ''}</div><div class="ek-lista">${redovi.join('')}</div>`;
  }

  // ----- upravljanje kvizom s ovog ekrana (samo uz ?zoni) -----
  let sekunde = null, zadnjiHtml = null, skrivTimer = null, akcije = {};
  const traka = document.createElement('div');
  traka.id = 'kontrole';
  const brKrugova = ()=>Math.max(1, Math.ceil(pitanja.length / poKrugu));
  const upd = o=>upisiStanje(o);
  const sek = ()=>sekunde || stanje.timerSekunde || 45;

  if(upravlja){
    document.body.appendChild(traka);
    traka.addEventListener('click', e=>{
      const b = e.target.closest('button[data-a]');
      if(b && akcije[b.dataset.a]) akcije[b.dataset.a]();
    });
    app.addEventListener('click', e=>{
      const b = e.target.closest('.ek-ocj button');
      if(b) postaviOcjenu(b.dataset.id, b.dataset.o);
    });
    // kontrole se pojave na pomjeranje miša / dodir i nestanu poslije 4 s mirovanja
    const pokazi = ()=>{
      document.body.classList.add('kontrole');
      clearTimeout(skrivTimer);
      skrivTimer = setTimeout(()=>{
        if(traka.matches(':hover') || traka.contains(document.activeElement)) pokazi();
        else document.body.classList.remove('kontrole');
      }, 4000);
    };
    ['mousemove','mousedown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev, pokazi, {passive:true}));
    pokazi();
    document.addEventListener('keydown', e=>{
      if(!stanje || e.target.tagName==='INPUT') return;
      const a = akcije;
      if(e.code==='Space'){ e.preventDefault(); (a.pauza || a.nastavi || a.timer || a.otkrij || (()=>{}))(); }
      else if(e.key==='ArrowRight') (a.next || a.pnext || a.otkrij || (()=>{}))();
      else if(e.key==='ArrowLeft') (a.prev || a.pprev || (()=>{}))();
    });
  }

  function crtajKontrole(){
    const f = stanje.faza, n = stanje.trenutnoPitanje || 1;
    const krug = stanje.krug || Math.ceil(n/poKrugu) || 1;
    const jeZadnjaRunda = krug >= brKrugova();
    const zadnjeUKrugu = n % poKrugu === 0 || n >= pitanja.length;
    const pocetakRunde = (krug-1)*poKrugu + 1;
    const krajRunde = Math.min(krug*poKrugu, pitanja.length);
    const akc = {};
    let h = '';
    const dugme = (id, tekst, klasa, fn, onemoguci)=>{
      if(!onemoguci) akc[id] = fn;
      h += `<button class="btn ${klasa||''}" data-a="${id}" ${onemoguci?'disabled':''}>${tekst}</button>`;
    };
    const unos = ()=>{ h += `<label>Sekundi: <input id="kSek" type="number" min="5" style="width:70px"></label>`; };

    if(f==='cekanje'){
      unos();
      dugme('start', '▶ Pokreni Pitanje 1', 'primary',
        ()=>upd({trenutnoPitanje:1, faza:'aktivno', timerSekunde:sek(), timerKraj:null, timerPauzaSekunde:null, krug:1}), pitanja.length===0);
    } else if(f==='aktivno'){
      const brojUKrugu = ((n-1) % poKrugu) + 1;
      unos();
      if(stanje.timerKraj) dugme('pauza', '⏸ Pauziraj', '',
        ()=>upd({timerKraj:null, timerPauzaSekunde:Math.max(0, Math.round((stanje.timerKraj-Date.now())/1000))}));
      else if(stanje.timerPauzaSekunde) dugme('nastavi', `▶ Nastavi (${stanje.timerPauzaSekunde}s)`, '',
        ()=>upd({timerKraj:Date.now()+stanje.timerPauzaSekunde*1000, timerPauzaSekunde:null}));
      dugme('timer', '▶ Pokreni tajmer', (stanje.timerKraj||stanje.timerPauzaSekunde) ? '' : 'primary',
        ()=>upd({timerSekunde:sek(), timerKraj:Date.now()+sek()*1000, timerPauzaSekunde:null}));
      dugme('prev', '← Prethodno', '', ()=>upd({trenutnoPitanje:n-1, timerKraj:null, timerPauzaSekunde:null}), brojUKrugu<=1);
      dugme('next', zadnjeUKrugu ? `Završi ${krug}. krug → pregled` : 'Sljedeće pitanje →', 'primary',
        zadnjeUKrugu ? ()=>upd({faza:'pregled', timerKraj:null, timerPauzaSekunde:null, pregledPitanje:pocetakRunde})
                     : ()=>upd({trenutnoPitanje:n+1, timerKraj:null, timerPauzaSekunde:null}));
      h += `<span class="hint">Razmak: tajmer · ← →: pitanja</span>`;
    } else if(f==='pregled'){
      const pq = stanje.pregledPitanje || 1;
      dugme('pprev', '← Prethodno', '', ()=>upd({pregledPitanje:pq-1}), pq<=pocetakRunde);
      dugme('pnext', 'Sljedeće →', '', ()=>upd({pregledPitanje:pq+1}), pq>=krajRunde);
      const stPred = odgovori.filter(o=>o.pitanje===pq).map(o=>({id:o.id, stara:o.ocjena, nova:predlozi(pitanja.find(x=>x.broj===pq), o)})).filter(x=>x.nova);
      dugme('prijedlozi', `💡 Prihvati prijedloge (${stPred.length})`, '', ()=>grupnaOcjena(stPred, 'prijedlozi ocjena'), !stPred.length);
      dugme('sve', '✓ Sve tačno', '', async ()=>{
        if(!confirm('Označiti SVE odgovore na ovom pitanju kao tačne? Ovo prepisuje postojeće ocjene.')) return;
        await grupnaOcjena(odgovori.filter(o=>o.pitanje===pq).map(o=>({id:o.id, stara:o.ocjena, nova:'tacno'})), 'sve tačno');
      });
      dugme('rang', jeZadnjaRunda ? '🏆 Konačna rang lista' : `🏆 Međurezultat (kraj ${krug}. kruga)`, 'success',
        ()=>upd((jeZadnjaRunda ? {faza:'rang', otkriveno:0} : {faza:'medjurang'})));
      h += `<span class="hint">Ocjene: ✓ ± ✗ pored svakog odgovora</span>`;
    } else if(f==='medjurang'){
      dugme('nazad', '← Nazad na pregled', '', ()=>upd({faza:'pregled'}));
      if(krug < brKrugova()) dugme('sljedeci', `▶ Pokreni ${krug+1}. krug`, 'primary',
        ()=>upd({trenutnoPitanje:krug*poKrugu+1, faza:'aktivno', krug:krug+1, timerKraj:null, timerPauzaSekunde:null}));
    } else if(f==='rang'){
      const Nt = prijavljene().length, otk = stanje.otkriveno==null ? Nt : stanje.otkriveno;
      dugme('otkrij', otk>=Nt ? '🎬 Sve otkriveno' : `🎬 Otkrij sljedeće (${otk}/${Nt})`, 'primary', ()=>upd({otkriveno:Math.min(Nt,otk+1)}), otk>=Nt);
      dugme('otkrijSve', 'Otkrij sve', '', ()=>upd({otkriveno:Nt}), otk>=Nt);
      dugme('nazad', '← Nazad na pregled', '', ()=>upd({faza:'pregled'}));
      dugme('pocetak', '⟲ Povratak na početak', '', ()=>upd({faza:'cekanje'}));
    }

    akcije = akc;   // uvijek svježe funkcije, čak i kad se HTML trake ne mijenja
    if(h !== zadnjiHtml){
      traka.innerHTML = h; zadnjiHtml = h;
      const inp = document.getElementById('kSek');
      if(inp){ inp.value = sek(); inp.oninput = ()=>{ sekunde = parseInt(inp.value) || null; }; }
    }
  }

  function crtaj(){
    if(!stanje){ app.innerHTML = '<div class="ek-jedan"><div class="ek-centar ek-naslov">Učitavanje…</div></div>'; return; }
    if(stanje.faza!=='rang') zadnjeOtk = null;
    if(stanje.faza==='rang' && (tip==='sve' || tip==='rezultati')) app.innerHTML = `<div class="ek-jedan">${viewOtkrivanje()}</div>`;
    else if(tip==='pitanje') app.innerHTML = `<div class="ek-jedan ek-sredina">${viewPitanje()}</div>`;
    else if(tip==='odgovori') app.innerHTML = `<div class="ek-jedan">${viewOdgovori()}</div>`;
    else if(tip==='rezultati') app.innerHTML = `<div class="ek-jedan">${viewRezultati()}</div>`;
    else app.innerHTML = `<div class="ek-sve">
      <div class="ek-panel ek-gore">${viewPitanje()}</div>
      <div class="ek-dolje">
        <div class="ek-panel">${viewOdgovori()}</div>
        <div class="ek-panel">${viewRezultati()}</div>
      </div></div>`;
    if(stanje.faza==='aktivno' && stanje.timerKraj && document.getElementById('timerNum')) pokreniTimerPrikaz(stanje.timerKraj, 'timerNum');
    if(upravlja) crtajKontrole();
  }
}

// ============================== EKIPA ==============================
function pokreniEkipu(){
  let mojaBoja = localStorage.getItem('pubkviz_boja');
  let stanje = null, timovi = null, pitanja = [], poKrugu = PITANJA_PO_KRUGU_DEFAULT;

  stanjeRef.onSnapshot(snap=>{ stanje = snap.data(); crtaj(); });
  timoviRef.onSnapshot(snap=>{ timovi = snap.data(); if(!mojaBoja) crtaj(); });
  pitanjaRef.onSnapshot(snap=>{
    const d = snap.data() || {};
    pitanja = parsirajPitanja(d.tekst || '');
    poKrugu = d.poKrugu || PITANJA_PO_KRUGU_DEFAULT;
    crtaj();
  });

  function brKrugova(){ return Math.max(1, Math.ceil(pitanja.length / poKrugu)); }

  function crtaj(){
    if(!mojaBoja) return crtajBirajBoju();
    if(!stanje){ app.innerHTML='Učitavanje...'; return; }
    if(stanje.faza==='cekanje') return crtajCekanje();
    if(stanje.faza==='aktivno') return crtajPitanje();
    if(stanje.faza==='pregled') return crtajCekaRang();
    if(stanje.faza==='medjurang') return crtajMedjuragEkipa();
    if(stanje.faza==='rang') return crtajRangEkipa();
  }

  function crtajBirajBoju(){
    const t = timovi || {};
    app.innerHTML = `<div class="wrap"><h1>Odaberi  boju ekipe</h1><div class="bojegrid">
      ${BOJE.map(b=>`<button class="bojebtn" style="background:${b.hex};color:${tamnoText(b.key)}" data-k="${b.key}" ${t[b.key]?'disabled':''}>${b.naziv}${t[b.key]?' (zauzeto)':''}</button>`).join('')}
    </div></div>`;
    document.querySelectorAll('.bojebtn').forEach(btn=>{
      btn.onclick = async ()=>{
        const k = btn.dataset.k;
        const ok = await db.runTransaction(async tr=>{
          const doc = await tr.get(timoviRef);
          if(doc.data()[k]) return false;
          tr.update(timoviRef, {[k]:true});
          return true;
        });
        if(ok){ mojaBoja=k; localStorage.setItem('pubkviz_boja', k); crtaj(); }
        else alert('Ta boja je upravo zauzeta, izaberi drugu.');
      };
    });
  }

  function bedz(){
    const b=bojaByKey(mojaBoja);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <div class="mojaboja" style="margin-bottom:0;background:${b.hex};color:${tamnoText(b.key)}">${b.naziv}</div>
      <button id="promBojaBtn" class="btn" style="padding:6px 12px;font-size:0.85rem;margin:0">Promijeni boju</button>
    </div>`;
  }
  function vezistiPromjenuBoje(){
    const el = document.getElementById('promBojaBtn');
    if(el) el.onclick = ()=>{
      if(!confirm('Obrisati tvoj sačuvani izbor boje na ovom uređaju? Moraćeš ponovo izabrati boju, a svi dosadašnji odgovori i bodovi ostaju vezani za staru boju — nećeš ih moći vratiti pod novom bojom.')) return;
      localStorage.removeItem('pubkviz_boja');
      mojaBoja = null;
      crtaj();
    };
  }

  function crtajCekanje(){ app.innerHTML = `<div class="wrap">${bedz()}<h2>Čekaj da nastavnik pokrene kviz...</h2></div>`; vezistiPromjenuBoje(); }

  function crtajPitanje(){
    const brojP = stanje.trenutnoPitanje;
    const krug = stanje.krug || Math.ceil(brojP/poKrugu);
    const brojUKrugu = ((brojP-1) % poKrugu) + 1;
    const docId = brojP+'_'+mojaBoja;
    const pTrenutno = pitanja.find(x=>x.broj===brojP);
    const jePovezi = !!(pTrenutno && pTrenutno.povezi);
    const jeDva = !!(pTrenutno && pTrenutno.dva);
    odgovoriRef.doc(docId).get().then(snap=>{
      const poslato = snap.exists;
      const staviznak = jePovezi ? `<p style="color:var(--muted);text-align:center;margin:8px 0 0">Upiši 4 pojma odvojena zarezom</p>` :
        jeDva ? `<p style="color:var(--muted);text-align:center;margin:8px 0 0">Upiši dva odgovora odvojena zarezom</p>` : '';
      app.innerHTML = `<div class="wrap">${bedz()}
        <div class="oznaka-red">
          <span class="oznaka-krug">${krug}. Krug</span>
          <span class="oznaka-pitanje">Pitanje ${brojUKrugu} / ${poKrugu}</span>
          ${jePovezi ? `<span class="oznaka-tip">Poveži: 4 pojma</span>` : ''}
          ${jeDva ? `<span class="oznaka-tip">Dva odgovora</span>` : ''}
        </div>
        ${stanje.timerKraj ? `<div class="timer">⏱ <span id="timerNum"></span></div>` :
          stanje.timerPauzaSekunde ? `<div class="timer" style="color:var(--muted)">⏸ Pauzirano</div>` : ''}
        ${poslato ? `<div class="poslato">✅ Odgovor poslan</div>
           <div class="btnrow" style="justify-content:center"><button class="btn" id="izmijeniBtn">✏️ Izmijeni odgovor</button></div>` :
          `<textarea id="odgTxt" rows="3" placeholder="Upiši odgovor..."></textarea>
           ${staviznak}
           <div id="greskaSlanje" style="color:var(--bad-ink);text-align:center;margin-top:8px;display:none">Greška pri slanju, pokušaj ponovo.</div>
           <div class="btnrow" style="justify-content:center"><button class="btn success" id="posaljiBtn">Pošalji odgovor</button></div>`}
      </div>`;
      if(stanje.timerKraj) pokreniTimerPrikaz(stanje.timerKraj, 'timerNum');
      vezistiPromjenuBoje();
      if(!poslato){
        const ta = document.getElementById('odgTxt');
        ta.focus();
        const posaljiBtn = document.getElementById('posaljiBtn');
        posaljiBtn.onclick = async ()=>{
          const txt = ta.value.trim();
          if(!txt) return;
          if(VEZA.prekinuta){ const g=document.getElementById('greskaSlanje'); g.textContent='Veza prekinuta — odgovor NIJE poslan. Provjeri internet pa pokušaj ponovo.'; g.style.display='block'; return; }
          posaljiBtn.disabled = true;
          try{
            await odgovoriRef.doc(docId).set({pitanje:brojP, boja:mojaBoja, tekst:txt, ocjena:null});
            crtajPitanje();
          }catch(e){
            posaljiBtn.disabled = false;
            document.getElementById('greskaSlanje').style.display = 'block';
          }
        };
      } else {
        const izmBtn = document.getElementById('izmijeniBtn');
        if(izmBtn) izmBtn.onclick = ()=>{
          app.innerHTML = `<div class="wrap">${bedz()}
            <div class="oznaka-red">
              <span class="oznaka-krug">${krug}. Krug</span>
              <span class="oznaka-pitanje">Pitanje ${brojUKrugu} / ${poKrugu}</span>
            </div>
            ${stanje.timerKraj ? `<div class="timer">⏱ <span id="timerNum"></span></div>` : ''}
            <textarea id="odgTxt2" rows="3">${escapeHtml(snap.data().tekst)}</textarea>
            ${staviznak}
            <div id="greskaSlanje2" style="color:var(--bad-ink);text-align:center;margin-top:8px;display:none">Greška pri slanju, pokušaj ponovo.</div>
            <div class="btnrow" style="justify-content:center"><button class="btn success" id="posaljiBtn2">Snimi izmjenu</button></div>
          </div>`;
          if(stanje.timerKraj) pokreniTimerPrikaz(stanje.timerKraj, 'timerNum');
          vezistiPromjenuBoje();
          const ta2 = document.getElementById('odgTxt2');
          ta2.focus();
          const btn2 = document.getElementById('posaljiBtn2');
          btn2.onclick = async ()=>{
            const txt = ta2.value.trim();
            if(!txt) return;
            if(VEZA.prekinuta){ const g=document.getElementById('greskaSlanje2'); g.textContent='Veza prekinuta — izmjena NIJE snimljena. Provjeri internet pa pokušaj ponovo.'; g.style.display='block'; return; }
            btn2.disabled = true;
            try{
              await odgovoriRef.doc(docId).set({pitanje:brojP, boja:mojaBoja, tekst:txt, ocjena:null});
              crtajPitanje();
            }catch(e){
              btn2.disabled = false;
              document.getElementById('greskaSlanje2').style.display = 'block';
            }
          };
        };
      }
    });
  }

  function crtajCekaRang(){ app.innerHTML = `<div class="wrap">${bedz()}<h2>Nastavnik pregleda odgovore...</h2><p>Rang lista stiže uskoro.</p></div>`; vezistiPromjenuBoje(); }

  function crtajMedjuragEkipa(){
    const krugZavrsen = stanje.krug || 1;
    const krajRunde = krugZavrsen*poKrugu;
    odgovoriRef.where('pitanje','<=',krajRunde).get().then(snap=>{
      const bodovi={}; BOJE.forEach(b=>bodovi[b.key]=0);
      snap.forEach(d=>{ const o=d.data(); bodovi[o.boja]=(bodovi[o.boja]||0)+(BODOVI[o.ocjena]||0); });
      const lista = BOJE.map(b=>({...b, bod:bodovi[b.key]||0})).sort((a,b)=>b.bod-a.bod);
      app.innerHTML = `<div class="wrap">${bedz()}<h1>📊 Međurezultat — kraj ${krugZavrsen}. Kruga</h1>
        ${lista.map((t,i)=>`<div class="rangred ${t.key===mojaBoja?'mojtim':''}" style="background:${t.hex};color:${tamnoText(t.key)}"><span class="mjesto">${i+1}.</span> ${t.naziv} — <b>${t.bod}</b></div>`).join('')}
        <p style="color:var(--muted)">Čekaj da nastavnik pokrene sljedeću rundu...</p>
      </div>`;
      vezistiPromjenuBoje();
    });
  }

  function crtajRangEkipa(){
    const Nt = Math.max(1, BOJE.filter(b=>(timovi||{})[b.key]).length);
    const otk = stanje.otkriveno;
    if(otk!=null){
      if(otk < Nt){ window.__rangMoze = false; clearTimeout(window.__rangTimer); window.__rangTimer = null; }
      else if(!window.__rangTimer && !window.__rangMoze){ window.__rangTimer = setTimeout(()=>{ window.__rangMoze = true; crtaj(); }, 4500); }
      if(!window.__rangMoze){
        app.innerHTML = `<div class="wrap">${bedz()}<h1>🏆 Rang lista</h1><h2>Pogledaj projektor — pobjednici se otkrivaju!</h2><p style="color:var(--muted)">Otkriveno mjesta: ${Math.min(otk,Nt)} / ${Nt}</p></div>`;
        vezistiPromjenuBoje(); return;
      }
    }
    odgovoriRef.get().then(snap=>{
      const bodovi={}; BOJE.forEach(b=>bodovi[b.key]=0);
      snap.forEach(d=>{ const o=d.data(); bodovi[o.boja]=(bodovi[o.boja]||0)+(BODOVI[o.ocjena]||0); });
      const lista = BOJE.map(b=>({...b, bod:bodovi[b.key]||0})).sort((a,b)=>b.bod-a.bod);
      app.innerHTML = `<div class="wrap">${bedz()}<h1>🏆 Rang lista</h1>
        ${lista.map((t,i)=>`<div class="rangred ${t.key===mojaBoja?'mojtim':''}" style="background:${t.hex};color:${tamnoText(t.key)}"><span class="mjesto">${i+1}.</span> ${t.naziv} — <b>${t.bod}</b></div>`).join('')}
      </div>`;
      vezistiPromjenuBoje();
    });
  }
}

// ================== NOVO: veza, poništavanje, prijedlozi ocjena, zvuk ==================
var VEZA = {prekinuta:false};
function pratiVezu(){
  var b = document.createElement('div'); b.id = 'vezaBanner';
  b.textContent = '⚠️ Veza prekinuta — provjeri internet. Odgovori se ne šalju dok se veza ne vrati.';
  document.body.appendChild(b);
  var cache = false, timer = null;
  function osvjezi(){ var off = !navigator.onLine || cache; VEZA.prekinuta = off; b.style.display = off ? 'block' : 'none'; }
  window.addEventListener('offline', osvjezi);
  window.addEventListener('online', function(){ cache = false; osvjezi(); });
  stanjeRef.onSnapshot({includeMetadataChanges:true}, function(s){
    clearTimeout(timer);
    if(s.metadata.fromCache){ timer = setTimeout(function(){ cache = true; osvjezi(); }, 4000); }
    else { cache = false; osvjezi(); }
  }, function(){ cache = true; osvjezi(); });
  osvjezi();
}

// --- poništavanje zadnje akcije (nastavnik i projektor s ?zoni) ---
var UNDO = [], STANJE_ZADNJE = null, UNDO_KLJUCEVI = ['trenutnoPitanje','faza','pregledPitanje','krug','otkriveno'];
function jeUpravljac(){ return ULOGA==='nastavnik' || (ULOGA==='ekran' && params.has(TAJNA_RIJEC_NASTAVNIK)); }
function opisPromjene(p){
  var f = {rang:'konačna rang lista', medjurang:'međurezultat', pregled:'pregled odgovora', aktivno:'prelazak na pitanja', cekanje:'povratak na početak'};
  if(p.faza) return f[p.faza] || 'promjena faze';
  if(p.trenutnoPitanje!==undefined) return 'promjena pitanja';
  if(p.pregledPitanje!==undefined) return 'promjena pitanja u pregledu';
  return 'otkrivanje mjesta';
}
function gurniUndo(a){ UNDO.push(a); if(UNDO.length>30) UNDO.shift(); osvjeziUndo(); }
function upisiStanje(promjene){
  var st = STANJE_ZADNJE;
  if(st && Object.keys(promjene).some(function(k){ return UNDO_KLJUCEVI.indexOf(k)>=0; })){
    var stare = {};
    Object.keys(promjene).forEach(function(k){ stare[k] = (st[k]===undefined ? null : st[k]); });
    gurniUndo({tip:'stanje', stare:stare, opis:opisPromjene(promjene)});
  }
  return stanjeRef.update(promjene);
}
function postaviOcjenu(id, nova){
  return odgovoriRef.doc(id).get().then(function(s){
    gurniUndo({tip:'ocjene', stavke:[{id:id, stara:(s.exists ? (s.data().ocjena||null) : null)}], opis:'ocjena'});
    return odgovoriRef.doc(id).update({ocjena:nova});
  });
}
function grupnaOcjena(stavke, opis){
  if(!stavke.length) return Promise.resolve();
  gurniUndo({tip:'ocjene', stavke:stavke.map(function(x){ return {id:x.id, stara:x.stara||null}; }), opis:opis});
  var batch = db.batch();
  stavke.forEach(function(x){ batch.update(odgovoriRef.doc(x.id), {ocjena:x.nova}); });
  return batch.commit();
}
function ponistiZadnje(){
  var a = UNDO.pop(); osvjeziUndo();
  if(!a) return Promise.resolve();
  if(a.tip==='stanje'){
    var s = Object.assign({}, a.stare);
    if('timerKraj' in s) s.timerKraj = (s.timerKraj && s.timerKraj > Date.now()) ? s.timerKraj : null;
    return stanjeRef.update(s);
  }
  var batch = db.batch();
  a.stavke.forEach(function(x){ batch.update(odgovoriRef.doc(x.id), {ocjena:x.stara}); });
  return batch.commit();
}
function osvjeziUndo(){
  if(!jeUpravljac()) return;
  var btn = document.getElementById('undoBtn');
  if(!btn){ btn = document.createElement('button'); btn.id = 'undoBtn'; btn.className = 'btn'; btn.onclick = function(){ ponistiZadnje(); }; document.body.appendChild(btn); }
  var z = UNDO[UNDO.length-1];
  btn.style.display = z ? 'block' : 'none';
  if(z) btn.textContent = '↩ Poništi: ' + z.opis;
}
document.addEventListener('keydown', function(e){
  if(jeUpravljac() && (e.ctrlKey||e.metaKey) && e.key && e.key.toLowerCase()==='z' && !/INPUT|TEXTAREA/.test(e.target.tagName)){ e.preventDefault(); ponistiZadnje(); }
});
stanjeRef.onSnapshot(function(s){ STANJE_ZADNJE = s.data(); });

// --- automatsko predlaganje ocjene (nastavnik samo potvrđuje) ---
function norm(s){
  return String(s||'').toLowerCase().replace(/đ/g,'dj').replace(/č|ć/g,'c').replace(/š/g,'s').replace(/ž/g,'z')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  var m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  var p=[], i, j; for(j=0;j<=n;j++) p[j]=j;
  for(i=1;i<=m;i++){ var prev=p[0]; p[0]=i; for(j=1;j<=n;j++){ var t=p[j]; p[j]=Math.min(p[j]+1, p[j-1]+1, prev+(a[i-1]===b[j-1]?0:1)); prev=t; } }
  return p[n];
}
function slicni(a,b){
  if(!a || !b) return false;
  if(a===b || a.replace(/ /g,'')===b.replace(/ /g,'')) return true;
  if(/\d/.test(a) || /\d/.test(b)) return false;   // brojevi i godine moraju biti tačni
  var d = a.length<=4 ? 0 : (a.length<=8 ? 1 : 2);
  return lev(a,b) <= d;
}
function dijelovi(s, n){
  var d = String(s||'').split(/[,;]+/).map(norm).filter(Boolean);
  if(n===2 && d.length===1){
    var d2 = String(s).split(/\s+i\s+|\s*\/\s*|\s*&\s*/i).map(norm).filter(Boolean);
    if(d2.length===2) d = d2;
  }
  return d;
}
function predlozi(p, o){
  if(!p || !o || o.ocjena) return null;
  var tim = String(o.tekst||'');
  if(!norm(tim)) return null;
  if(p.povezi || p.dva){
    var tacni = dijelovi(p.odgovor, p.povezi ? 4 : 2);
    if(tacni.length < 2) return null;
    var tp = dijelovi(tim, p.povezi ? 4 : 2), pogodak = 0;
    tacni.forEach(function(t){
      var i = tp.findIndex(function(x){ return slicni(t, x); });
      if(i>=0){ pogodak++; tp.splice(i,1); }
    });
    if(pogodak===tacni.length) return 'tacno';
    if(pogodak>0 && pogodak*2>=tacni.length) return 'pola';
    return null;
  }
  var base = String(p.odgovor||'');
  var varijante = base.split(/\s*\/\s*|\s+ili\s+/i);
  varijante.push(base.replace(/\([^)]*\)/g,' '));
  var nt = norm(tim);
  for(var k=0;k<varijante.length;k++){ if(slicni(norm(varijante[k]), nt)) return 'tacno'; }
  return null;
}

// --- zvuk i konfete za otkrivanje pobjednika ---
var AUDIO_CTX = null;
function zvuk(){
  try{ if(!AUDIO_CTX) AUDIO_CTX = new (window.AudioContext||window.webkitAudioContext)(); if(AUDIO_CTX.state==='suspended') AUDIO_CTX.resume(); }catch(e){}
  return AUDIO_CTX;
}
['click','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, function(){ zvuk(); }, {passive:true}); });
function ton(f, t0, d, tip, v){
  var c = AUDIO_CTX; if(!c) return;
  var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = tip || 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v||0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05);
}
function zvukOtkrij(k){ ton(330+k*40, 0, .18, 'triangle'); ton(440+k*40, .09, .28, 'triangle'); }
function zvukBubanj(){ for(var i=0;i<16;i++) ton(110+i*4, i*0.11, .09, 'square', 0.10+i*0.01); }
function zvukFanfara(){ [[523,0],[659,.15],[784,.3],[1047,.5]].forEach(function(x){ ton(x[0], x[1], .6, 'sawtooth', .16); ton(x[0]/2, x[1], .6, 'triangle', .2); }); }
function konfete(){
  var boje = ['#f2b705','#2563eb','#16a34a','#dc2626','#f97316','#e5e7eb'];
  for(var i=0;i<90;i++){
    var d = document.createElement('div'); d.className = 'konfeta';
    d.style.left = (Math.random()*100)+'vw'; d.style.background = boje[i%boje.length];
    d.style.animationDuration = (2.5+Math.random()*2.5)+'s'; d.style.animationDelay = (Math.random()*.8)+'s';
    document.body.appendChild(d); setTimeout(function(el){ el.remove(); }, 6500, d);
  }
}

pratiVezu();
osvjeziUndo();
